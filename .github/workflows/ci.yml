name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gharpayy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gharpayy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend/src
        run: npm install

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: TypeScript check (backend)
        working-directory: backend/src
        run: npm run typecheck

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npm run typecheck

      - name: Lint (backend)
        working-directory: backend/src
        run: npm run lint

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests (backend)
        working-directory: backend/src
        run: npm test

      - name: Unit tests (frontend)
        working-directory: frontend
        run: npm test

      - name: Build backend
        working-directory: backend/src
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate database migrations
        run: node scripts/validate-migrations.js

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Load-test smoke check
        run: k6 inspect load-tests/k6-public-traffic.js
